[project]
name = "shelly-slack-bridge"
version = "0.1.0"
description = "Slack Socket Mode bridge for a shellm identity"
requires-python = ">=3.12"
dependencies = [
    "slack-bolt>=1.20",
    "httpx>=0.27",
]

[project.scripts]
shelly-slack-bridge = "shelly_slack.cli:main"
# Back-compat alias for the deployed systemd unit; remove after the box migration.
shellm-slack-bridge = "shelly_slack.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "slack-cli-hooks>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shelly_slack"]
