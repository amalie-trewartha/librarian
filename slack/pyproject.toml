[project]
name = "librarian-slack-bridge"
version = "0.1.0"
description = "Slack Socket Mode bridge for a Librarian identity"
requires-python = ">=3.12"
dependencies = [
    "slack-bolt>=1.20",
    "httpx>=0.27",
]

[project.scripts]
librarian-slack-bridge = "librarian_slack.cli:main"
# Back-compat alias from the Headlong era (deployed units, operator habits).
headlong-slack-bridge = "librarian_slack.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "slack-cli-hooks>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/librarian_slack"]
