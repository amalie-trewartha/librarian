[project]
name = "librarian"
version = "0.1.0"
description = "Librarian: typed, tagged memory store and context packer for Librarian project mode"
requires-python = ">=3.12"
# Runtime is standard library only (sqlite3, json, re, math, argparse): the
# CLI runs inside the shellm sandbox, where nothing but python3 is installed.
dependencies = []

[project.scripts]
librarian = "librarian.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/librarian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
