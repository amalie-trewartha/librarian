[project]
name = "headlong-telegram-bridge"
version = "0.1.0"
description = "Telegram Bot API bridge for a Headlong identity"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
headlong-telegram-bridge = "headlong_telegram.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headlong_telegram"]
