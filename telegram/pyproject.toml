[project]
name = "librarian-telegram-bridge"
version = "0.1.0"
description = "Telegram Bot API bridge for a Librarian identity"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
librarian-telegram-bridge = "librarian_telegram.cli:main"
# Back-compat alias from the Headlong era (deployed units, operator habits).
headlong-telegram-bridge = "librarian_telegram.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/librarian_telegram"]
