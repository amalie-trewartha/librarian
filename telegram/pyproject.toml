[project]
name = "shelly-telegram-bridge"
version = "0.1.0"
description = "Telegram Bot API bridge for a shellm identity"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
shelly-telegram-bridge = "shelly_telegram.cli:main"
# Back-compat alias for the deployed systemd unit; remove after the box migration.
shellm-telegram-bridge = "shelly_telegram.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shelly_telegram"]
